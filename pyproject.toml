# Lint, type and test settings for the Staubsauger files. The older modules predate this gate
# and are not checked by it; pass the new paths explicitly:
#   ruff format --check staubsauger.py util/seenbook*.py tests
#   ruff check staubsauger.py util/seenbook*.py tests
#   mypy util/seenbook.py util/seenbook_telegram.py tests
#   pytest tests

[tool.ruff]
target-version = "py311"
# Same as red-discordbot-cogs, so the shared util/seenbook.py formats identically in both repos.
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PTH"]
ignore = ["E501"]
# staubsauger.py follows Pyrobud's own Dict/List/Optional style like the other modules.
per-file-ignores = { "staubsauger.py" = ["UP006", "UP007", "UP035", "UP045"] }

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Check util/ and tests/ as top-level packages, the way the tests import them.
explicit_package_bases = true

[[tool.mypy.overrides]]
# Telethon ships no type information.
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

# pytest settings live in tests/pytest.ini: the repo root is itself a package (Pyrobud's
# custom_modules) that cannot be imported outside Pyrobud, so pytest must be rooted below it.
